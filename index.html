<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeDojo Daily</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Fira+Code:wght@400&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body data-v="login">
  <nav id="nav"></nav>
  <main id="app"></main>

  <div id="toast" role="status"></div>
  <div id="stars" aria-hidden="true"></div>

  <dialog id="dlg" aria-labelledby="dg">
    <h2 id="dg" class="shine" style="font-size: 1.9rem; line-height: 1.15">
      Improve your skills.<br>Grow yourself.
    </h2>
    <p style="color: var(--mu); margin: 0 0 20px">
      Every great coder started with one small problem. Solve one a day,
      learn from every mistake, and watch yourself get better.
    </p>
    <button class="b a" data-a="close">Let’s begin</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
